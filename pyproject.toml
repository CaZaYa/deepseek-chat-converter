[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek2any"
version = "1.0.0"
description = "Convert DeepSeek chat exports into Markdown, JSONL, ChatGPT JSON or Chatbox backups"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DeepSeek2Any contributors" }]
keywords = ["deepseek", "chat-export", "chatbox", "cherry-studio", "converter"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
deepseek2any = "dsc2any.cli:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
